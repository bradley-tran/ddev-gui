# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  dev:
    desc: Start the development server
    cmds:
      - wails3 dev

  generate:bindings:
    desc: Generate Wails v3 frontend bindings
    cmds:
      - wails3 generate bindings -ts -d frontend/bindings

  generate:syso:
    desc: Generate Windows resource (.syso) file
    cmds:
      - wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out rsrc_windows_amd64.syso

  build:frontend:
    desc: Build the frontend assets
    dir: frontend
    cmds:
      - npm run build

  build:
    desc: Build the application
    deps:
      - build:frontend
    cmds:
      - go build -tags "production,gtk3" -trimpath -buildvcs=false -ldflags="-w -s{{if eq OS "windows"}} -H windowsgui{{end}}" -o build/bin/ddev-gui{{exeExt}}

  run:
    desc: Build and run the application
    deps:
      - build
    cmds:
      - ./build/bin/ddev-gui{{exeExt}}

  test-backend:
    desc: Run backend tests
    cmds:
      - go test -tags gtk3 ./backend

  test-frontend:
    desc: Run frontend tests
    cmds:
      - cd frontend && npm test

  test:
    desc: Run all tests
    cmds:
      - task test-backend
      - task test-frontend
